  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #193044" transform="translate(116.929687 497.562531)">Ribbons show adjacent-date transitions; identities are not traceable through the middle column.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #193044" transform="translate(109.717969 509.565266)">Bands are analyst-defined, with exact 25%, 50% and 75% boundaries assigned to the higher band.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #193044" transform="translate(149.386719 521.568)">Every country has equal weight; ribbons do not represent people or internet traffic.</text>
